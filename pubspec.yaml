name: samig_treasures
description: كنوز سامغ - Samig Treasures
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  http: ^1.5.0

  # PDF
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/app_icon.png

flutter_launcher_icons:
  android: true
  image_path: "assets/fonts/app_icon.png"
  adaptive_icon_background: "#24104F"
  adaptive_icon_foreground: "assets/fonts/app_icon.png"
